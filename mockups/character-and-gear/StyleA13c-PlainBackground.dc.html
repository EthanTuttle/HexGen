<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Character & gear A v13c: plain background</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#B5532F}a:hover{color:#7E3519}
@keyframes popin{0%{transform:translateY(6px);opacity:0}100%{transform:none;opacity:1}}
@keyframes land0{0%{transform:scale(0.3);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes land1{0%{transform:scale(0.3);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes glow{0%{opacity:0.45}50%{opacity:1}100%{opacity:0.45}}
@keyframes dotpulse{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}100%{transform:translateX(0)}}
</style>
</helmet>
<div data-root="gear" onPointerMove="{{dragMove}}" onPointerUp="{{dragEnd}}" onPointerLeave="{{dragCancel}}" style="width: 844px; height: 390px; position: relative; overflow: hidden; background: #BFD9D2; color: #24302C; font-family: Nunito, sans-serif; user-select: none">


  <!-- Party tray: the same tray, in the same spot, as on the map -->
  <div role="group" aria-label="Party" style="position: absolute; left: 12px; top: 12px; width: 60px; padding: 8px 6px; z-index: 4; display: flex; flex-direction: column; align-items: center; gap: 5px; background: #B89C7E; border-radius: 18px; box-shadow: 0 4px 0 #8F7458">
    <sc-for list="{{party}}" as="p" hint-placeholder-count="4">
      <button type="button" aria-label="{{p.aria}}" aria-pressed="{{p.on}}" onClick="{{p.pick}}" style="padding: 0; border: none; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: inherit">
        <span style="position: relative; display: block; width: 38px; height: 44px; filter: drop-shadow(0 3px 0 #A48A62)">
          <span style="position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: {{p.rim}}"></span>
          <span style="position: absolute; inset: {{p.inset}}; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: {{p.face}}; display: flex; align-items: center; justify-content: center; color: #22262E; font-family: 'Lilita One', sans-serif; font-size: 16px">{{p.initial}}</span>
          <sc-if value="{{p.injured}}" hint-placeholder-val="{{ false }}">
            <span aria-hidden="true" style="position: absolute; right: -8px; top: -4px; width: 20px; height: 20px; border-radius: 50%; background: #8E3B2E; box-shadow: 0 2px 0 #5E2219; color: #FFF8EE; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8l8 8 M5 13l8-8a3 3 0 0 1 4 4l-8 8a3 3 0 0 1-4-4z M11 11h0.01 M13 13h0.01"></path></svg></span>
          </sc-if>
        </span>
        <span style="display: block; width: 40px; height: 5px; border-radius: 3px; background: #E6DCC8; overflow: hidden; box-shadow: inset 0 0 0 1px #A48A62">
          <span style="display: block; height: 5px; width: {{p.hpW}}; background: #4E9A5B"></span>
        </span>
      </button>
    </sc-for>
  </div>

  <!-- Character column: back, name, abilities (tap a row for its proficiencies), then passives at the foot -->
  <div style="position: absolute; left: 96px; top: 12px; width: 150px; height: 366px; box-sizing: border-box; padding: 8px 10px 10px; z-index: 2; background: #F6EEDF; border-radius: 18px; box-shadow: 0 5px 0 #CDB894; display: flex; flex-direction: column; gap: 4px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 6px">
      <button type="button" aria-label="Back to map" style="width: 36px; height: 41px; flex-shrink: 0; padding: 0; border: none; background: transparent; cursor: pointer; filter: drop-shadow(0 3px 0 #A48A62)">
        <span style="position: relative; display: block; width: 36px; height: 41px">
          <span style="position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: #BFAE8E"></span>
          <span style="position: absolute; inset: 3px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: #FCF7EE; display: flex; align-items: center; justify-content: center; color: #33403B">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
          </span>
        </span>
      </button>
      <div style="min-width: 0; font-family: 'Lilita One', sans-serif; font-size: 19px; line-height: 1.05">{{c.name}}</div>
    </div>
    <div style="font-size: 11px; font-weight: 700; color: #43524D; line-height: 1.3">{{c.sub}}</div>
    <span style="display: block; flex-shrink: 0; height: 2px; margin: 2px 0; background: #A48A62; opacity: 0.5; border-radius: 1px"></span>
    <div role="group" aria-label="Abilities" style="display: flex; flex-direction: column">
      <sc-for list="{{c.abilities}}" as="a" hint-placeholder-count="6">
        <sc-if value="{{a.divider}}" hint-placeholder-val="{{ true }}">
          <span style="display: block; flex-shrink: 0; height: 2px; margin: 3px 0; background: #A48A62; opacity: 0.3; border-radius: 1px"></span>
        </sc-if>
        <button type="button" aria-label="{{a.aria}}" aria-expanded="{{a.open}}" onClick="{{a.pin}}" onMouseEnter="{{a.hover}}" onMouseLeave="{{unhover}}" style="height: 25px; flex-shrink: 0; border: none; background: {{a.bg}}; border-radius: 8px; cursor: pointer; font-family: inherit; color: inherit; display: flex; align-items: center; gap: 4px; padding: 0 4px">
          <span style="width: 28px; flex-shrink: 0; font-weight: 900; font-size: 12px; letter-spacing: 0.04em; text-align: left">{{a.k}}</span>
          <span style="display: flex; width: 58px; flex-shrink: 0">
            <sc-for list="{{a.coins}}" as="coin" hint-placeholder-count="2">
              <span style="display: block; flex-shrink: 0; width: 13px; height: 13px; margin-left: {{coin.ml}}; border-radius: 50%; background: #E4B54C; box-shadow: inset 0 -2px 0 #A67A1F, 0 0 0 1px #F6EEDF"></span>
            </sc-for>
          </span>
          <span style="flex: 1; text-align: right; font-family: 'Lilita One', sans-serif; font-size: 16px">{{a.v}}</span>
        </button>
      </sc-for>
    </div>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 10px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5040">Passives</span>
      <div role="group" aria-label="Passives" style="display: flex; flex-wrap: wrap; gap: 4px">
        <sc-for list="{{passives}}" as="ps" hint-placeholder-count="2">
          <button type="button" aria-label="{{ps.aria}}" onClick="{{ps.pin}}" onMouseEnter="{{ps.hover}}" onMouseLeave="{{unhover}}" style="position: relative; width: 32px; height: 37px; padding: 0; border: none; background: transparent; cursor: pointer; filter: drop-shadow(0 3px 0 #A48A62); flex-shrink: 0">
            <span style="position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: {{ps.color}}"></span>
            <span style="position: absolute; inset: 3px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: #FCF7EE; display: flex; align-items: center; justify-content: center; color: {{ps.color}}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ps.icon}}"></path></svg>
            </span>
          </button>
        </sc-for>
      </div>
    </div>
  </div>

  <!-- Gear, then the inventory with Action cards and Mastery on top of it -->
  <div style="position: absolute; left: 258px; top: 12px; right: 18px; bottom: 12px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; gap: 12px; flex: 1; min-height: 0">

      <!-- Gear around the mini -->
      <div style="width: 352px; flex-shrink: 0; position: relative; display: flex; flex-direction: column; gap: 6px">
        <div style="height: 300px; display: flex; align-items: center; justify-content: space-between">
          <div style="width: 69px; display: flex; flex-direction: column; align-items: flex-start; padding: 7px; background: #B89C7E; border-radius: 18px; box-shadow: 0 4px 0 #8F7458">
            <sc-for list="{{leftSlots}}" as="s" hint-placeholder-count="4">
              <button type="button" data-drop="{{s.id}}" aria-label="{{s.aria}}" onPointerDown="{{s.down}}" onMouseEnter="{{s.hover}}" onMouseLeave="{{unhover}}" style="position: relative; width: 46px; height: 53px; flex-shrink: 0; padding: 0; border: none; background: transparent; cursor: pointer; touch-action: none; filter: drop-shadow(0 4px 0 #A48A62); margin-left: {{s.ml}}; margin-top: {{s.mt}}; transform: {{s.lift}}; transition: transform 0.15s ease-out">
                <span style="position: absolute; inset: -5px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: #F2C14E; opacity: {{s.glowOp}}; animation: {{s.glowAnim}}"></span>
                <span style="position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: {{s.rim}}"></span>
                <span style="position: absolute; inset: {{s.inset}}; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: {{s.face}}; display: flex; align-items: center; justify-content: center; color: {{s.ink}}; opacity: {{s.dim}}; animation: {{s.anim}}">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg>
                  <span style="position: absolute; left: 0; right: 0; bottom: 7px; display: flex; justify-content: center; gap: 3px">
                    <sc-for list="{{s.pips}}" as="pp" hint-placeholder-count="0"><span style="display: block; width: 4px; height: 4px; border-radius: 50%; background: {{pp.c}}"></span></sc-for>
                  </span>
                </span>
                <sc-if value="{{s.cross}}" hint-placeholder-val="{{ false }}">
                  <span aria-hidden="true" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #B3261E"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12 M18 6L6 18"></path></svg></span>
                </sc-if>
              </button>
            </sc-for>
          </div>

          <!-- Model hex: a stand-in mini on its wooden base, showing the gear it wears -->
          <span style="position: relative; display: block; width: 186px; height: 214px; flex-shrink: 0; filter: drop-shadow(0 5px 0 #A48A62)">
            <span style="position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: #BFAE8E"></span>
            <span style="position: absolute; inset: 4px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: #EFE6D4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0">
              <svg role="img" aria-label="{{mini.aria}}" width="122" height="166" viewBox="0 0 140 190">
                <path d="M30 170 v6 l20 12 h40 l20-12 v-6 l-20 12 h-40z" fill="#7E5C3C"></path>
                <polygon points="30,170 50,158 90,158 110,170 90,182 50,182" fill="#A47C55"></polygon>
                <path d="M54 128 L50 166 L64 166 L70 134 L76 166 L90 166 L86 128 Z" fill="{{mini.legs}}"></path>
                <path d="M47 158h18v10H44z M75 158h18v10H75z" fill="#5A4632" opacity="{{mini.bootsOp}}"></path>
                <path d="M44 70 Q70 58 96 70 L100 118 Q96 124 90 120 L88 100 L86 130 L54 130 L52 100 L50 120 Q44 124 40 118 Z" fill="{{mini.body}}"></path>
                <circle cx="70" cy="44" r="16" fill="{{mini.skin}}"></circle>
                <path d="M53 46 a17 17 0 0 1 34 0 v3 h-34z" fill="{{mini.helm}}" opacity="{{mini.helmOp}}"></path>
                <circle cx="44" cy="120" r="5.5" fill="#6B5640" opacity="{{mini.glovesOp}}"></circle>
                <circle cx="96" cy="120" r="5.5" fill="#6B5640" opacity="{{mini.glovesOp}}"></circle>
                <g transform="translate(4 84) scale(1.9)" opacity="{{mini.mainOp}}"><path d="{{mini.mainIcon}}" fill="none" stroke="#33403B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></g>
                <g transform="translate(90 84) scale(1.9)" opacity="{{mini.offOp}}"><path d="{{mini.offIcon}}" fill="none" stroke="#33403B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></g>
              </svg>
              <span style="font-size: 10px; font-weight: 800; color: #5A5040; margin-top: -4px">[Mini]</span>
            </span>
          </span>

          <div style="width: 69px; display: flex; flex-direction: column; align-items: flex-end; padding: 7px; background: #B89C7E; border-radius: 18px; box-shadow: 0 4px 0 #8F7458">
            <sc-for list="{{rightSlots}}" as="s" hint-placeholder-count="4">
              <button type="button" data-drop="{{s.id}}" aria-label="{{s.aria}}" onPointerDown="{{s.down}}" onMouseEnter="{{s.hover}}" onMouseLeave="{{unhover}}" style="position: relative; width: 46px; height: 53px; flex-shrink: 0; padding: 0; border: none; background: transparent; cursor: pointer; touch-action: none; filter: drop-shadow(0 4px 0 #A48A62); margin-right: {{s.ml}}; margin-top: {{s.mt}}; transform: {{s.lift}}; transition: transform 0.15s ease-out">
                <span style="position: absolute; inset: -5px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: #F2C14E; opacity: {{s.glowOp}}; animation: {{s.glowAnim}}"></span>
                <span style="position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: {{s.rim}}"></span>
                <span style="position: absolute; inset: {{s.inset}}; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: {{s.face}}; display: flex; align-items: center; justify-content: center; color: {{s.ink}}; opacity: {{s.dim}}; animation: {{s.anim}}">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg>
                  <span style="position: absolute; left: 0; right: 0; bottom: 7px; display: flex; justify-content: center; gap: 3px">
                    <sc-for list="{{s.pips}}" as="pp" hint-placeholder-count="0"><span style="display: block; width: 4px; height: 4px; border-radius: 50%; background: {{pp.c}}"></span></sc-for>
                  </span>
                </span>
                <sc-if value="{{s.cross}}" hint-placeholder-val="{{ false }}">
                  <span aria-hidden="true" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #B3261E"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12 M18 6L6 18"></path></svg></span>
                </sc-if>
              </button>
            </sc-for>
          </div>
        </div>

        <!-- Weapon set, then the belt -->
        <div style="height: 60px; box-sizing: border-box; align-self: center; padding: 2px 12px 5px; display: flex; align-items: center; justify-content: center; gap: 4px; background: #B89C7E; border-radius: 18px; box-shadow: 0 4px 0 #8F7458">
          <button type="button" aria-label="Swap weapon set, now {{setLabel}}" onClick="{{swapSet}}" style="width: 40px; height: 46px; padding: 0; border: none; background: transparent; cursor: pointer; filter: drop-shadow(0 4px 0 #7E3519)">
            <span style="position: relative; display: block; width: 40px; height: 46px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: #B5532F; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #FFF8EE">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4 M3 8h14 M17 20l4-4-4-4 M21 16H7"></path></svg>
              <span style="font-size: 11px; font-weight: 900">{{setShort}}</span>
            </span>
          </button>
          <sc-for list="{{bottomSlots}}" as="s" hint-placeholder-count="4">
            <sc-if value="{{s.gapBefore}}" hint-placeholder-val="{{ false }}">
              <span style="display: block; width: 2px; height: 36px; background: #F6EEDF; opacity: 0.6; margin: 0 8px; border-radius: 1px"></span>
            </sc-if>
            <button type="button" data-drop="{{s.id}}" aria-label="{{s.aria}}" onPointerDown="{{s.down}}" onMouseEnter="{{s.hover}}" onMouseLeave="{{unhover}}" style="position: relative; width: 46px; height: 53px; flex-shrink: 0; padding: 0; border: none; background: transparent; cursor: pointer; touch-action: none; filter: drop-shadow(0 4px 0 #A48A62); transform: {{s.lift}}; transition: transform 0.15s ease-out">
              <span style="position: absolute; inset: -5px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: #F2C14E; opacity: {{s.glowOp}}; animation: {{s.glowAnim}}"></span>
              <span style="position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: {{s.rim}}"></span>
              <span style="position: absolute; inset: {{s.inset}}; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: {{s.face}}; display: flex; align-items: center; justify-content: center; color: {{s.ink}}; opacity: {{s.dim}}; animation: {{s.anim}}">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg>
                <span style="position: absolute; left: 0; right: 0; bottom: 7px; display: flex; justify-content: center; gap: 3px">
                  <sc-for list="{{s.pips}}" as="pp" hint-placeholder-count="0"><span style="display: block; width: 4px; height: 4px; border-radius: 50%; background: {{pp.c}}"></span></sc-for>
                </span>
              </span>
              <sc-if value="{{s.cross}}" hint-placeholder-val="{{ false }}">
                <span aria-hidden="true" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #B3261E"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12 M18 6L6 18"></path></svg></span>
              </sc-if>
            </button>
          </sc-for>
        </div>
      </div>

      <!-- Action cards and Mastery, then the shared party inventory -->
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
        <span style="filter: drop-shadow(0 4px 0 #7E3519); display: block; flex-shrink: 0">
          <button type="button" style="width: 100%; height: 40px; padding: 0 14px; border: none; clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0 50%); background: #B5532F; color: #FFF8EE; font-family: 'Lilita One', sans-serif; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h11v14H4z M8 3h12v14"></path></svg>
            Action cards
          </button>
        </span>
        <span style="filter: drop-shadow(0 4px 0 #A48A62); display: block; flex-shrink: 0">
          <button type="button" style="width: 100%; height: 40px; padding: 0 14px; border: none; clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0 50%); background: #FCF7EE; color: #24302C; font-family: 'Lilita One', sans-serif; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 4v10l-7 4-7-4V7z M12 8v8 M9 11l3-3 3 3"></path></svg>
            Mastery
          </button>
        </span>
      <div data-drop="inv" style="flex: 1; min-height: 0; box-sizing: border-box; padding: 10px; background: #F6EEDF; border-radius: 18px; box-shadow: 0 5px 0 #CDB894; outline: {{inv.outline}}; outline-offset: -4px; display: flex; flex-direction: column; gap: 8px">
        <div style="height: 20px; display: flex; align-items: center; justify-content: space-between; gap: 6px">
          <span style="font-family: 'Lilita One', sans-serif; font-size: 15px">Party inventory</span>
          <sc-if value="{{inv.hasFilter}}" hint-placeholder-val="{{ false }}">
            <button type="button" aria-label="Show all items" onClick="{{inv.clearFilter}}" style="height: 24px; padding: 0 8px 0 10px; border: none; border-radius: 12px; background: #24302C; color: #F6EEDF; font-family: inherit; font-size: 11px; font-weight: 900; display: flex; align-items: center; gap: 4px; cursor: pointer">
              {{inv.filterLabel}}
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg>
            </button>
          </sc-if>
          <span style="margin-left: auto; display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 900; color: #5A3A05">
            <span aria-hidden="true" style="display: block; width: 13px; height: 13px; border-radius: 50%; background: #E4B54C; box-shadow: inset 0 -2px 0 #A67A1F"></span>
            [gold]
          </span>
        </div>
        <div style="display: flex; gap: 4px">
          <sc-for list="{{inv.tabs}}" as="tb" hint-placeholder-count="2">
            <button type="button" aria-pressed="{{tb.on}}" onClick="{{tb.pick}}" style="position: relative; flex: 1; height: 34px; border: none; clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%); background: {{tb.bg}}; color: {{tb.ink}}; font-family: Nunito, sans-serif; font-weight: 900; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px">
              <sc-if value="{{tb.dot}}" hint-placeholder-val="{{ false }}">
                <span aria-label="New items" style="display: block; width: 8px; height: 8px; border-radius: 50%; background: #E0582F; box-shadow: 0 0 0 2px #FCF7EE"></span>
              </sc-if>
              {{tb.label}}
            </button>
          </sc-for>
        </div>
        <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 6px 0 6px 2px">

      const toRect = animate ? rectOf('[data-drop="' + id + '"]') : null;
      const flies = [];
      let it;
      if (src.kind === 'inv') {
        const f = findInv(I, src.uid); if (!f) return;
        it = f.it;
        const fromRect = animate ? rectOf('[data-item="' + it.uid + '"]') : null;
        if (it.slot === 'cons' && it.count > 1) { it.count -= 1; it = Object.assign({}, it, { uid: it.uid + 'b' + Date.now(), count: undefined }); }
        else I[f.t].splice(f.i, 1);
        if (animate) flies.push(fly(it, fromRect, toRect));
        const old = getSlot(E, ci, setIdx, id);
        if (old) { toInv(I, old); flies.push(fly(old, toRect || rectOf('[data-drop="' + id + '"]'), invRect)); }
      } else {
        it = getSlot(E, ci, setIdx, src.id);
        const fromRect = rectOf('[data-drop="' + src.id + '"]');
        if (animate) flies.push(fly(it, fromRect, toRect));
        const old = getSlot(E, ci, setIdx, id);
        setSlot(E, ci, setIdx, src.id, null);
        if (old) {
          const back = fit(old, src.id);
          if (back && back.ok) setSlot(E, ci, setIdx, src.id, old);
          else { toInv(I, old); flies.push(fly(old, rectOf('[data-drop="' + id + '"]'), invRect)); }
        }
      }
      setSlot(E, ci, setIdx, id, it);
      // A two-handed weapon empties the off hand
      if (id === 'main' && it.hands === 2) {
        const off = getSlot(E, ci, setIdx, 'off');
        if (off) { setSlot(E, ci, setIdx, 'off', null); toInv(I, off); flies.push(fly(off, rectOf('[data-drop="off"]'), invRect)); }
      }
      const seenNext = it.uid ? seen.concat([it.uid]) : seen;
      launch({ eq: E, inv: I, filter: null, seen: seenNext, landAnim: animate }, flies, [id]);
    };
    const unequip = (id, animate) => {
      const E = clone(eq); const I = clone(inv);
      const it = getSlot(E, ci, setIdx, id); if (!it) return;
      setSlot(E, ci, setIdx, id, null); toInv(I, it);
      const flies = animate ? [fly(it, rectOf('[data-drop="' + id + '"]'), rectOf('[data-drop="inv"]'))] : [];
      launch({ eq: E, inv: I, tab: it.slot === 'cons' ? 'cons' : 'gear', landAnim: animate }, flies, []);
    };
    // A crossed slot's reason opens in a pop-up beside it
    const sayWhy = (why, sel, name) => {
      const k = (st.whyK || 0) + 1;
      this.setState({ why: { text: why, name: name, r: rectOf(sel) }, whyK: k, hover: null, pin: null });
      setTimeout(() => { if ((this.state || {}).whyK === k) this.setState({ why: null }); }, 2200);
    };

    // A tap (no drag) on an item or slot
    const tap = (src) => {
      if (src.kind === 'slot') {
        const here = getSlot(eq, ci, setIdx, src.id);
        if (hold && !(hold.kind === 'slot' && hold.id === src.id)) {
          const f = fit(holdItem, src.id);
          if (f && f.ok) return place(hold, src.id, true);
          if (f && !f.ok) return sayWhy(f.why, '[data-drop="' + src.id + '"]', holdItem.name);
        }
        if (hold && hold.kind === 'slot' && hold.id === src.id) return this.setState({ hold: null, why: null });
        if (here) return this.setState({ hold: src, filter: null, why: null, hover: null, pin: null, tab: kindOf(src.id) === 'belt' ? 'cons' : 'gear' });
        const lock = lockNote(src.id);
        if (lock) return sayWhy(lock, '[data-drop="' + src.id + '"]', SLOT_LABEL[src.id]);
        const k = kindOf(src.id);
        return this.setState({ filter: filter === src.id ? null : src.id, hold: null, why: null, pin: null, tab: k === 'belt' ? 'cons' : 'gear' });
      }
      const f0 = findInv(inv, src.uid); if (!f0) return;
      if (hold && hold.kind === 'inv' && hold.uid === src.uid) return this.setState({ hold: null, why: null });
      // With an empty slot tapped, or an equipped item picked up, a fitting item goes straight there
      const tgt = filter || (hold && hold.kind === 'slot' ? hold.id : null);
      if (tgt) { const f = fit(f0.it, tgt); if (f && f.ok) return place(src, tgt, true); if (f && !f.ok) return sayWhy(f.why, '[data-item="' + src.uid + '"]', f0.it.name); }
      this.setState({ hold: src, why: null, hover: null, pin: null, seen: seen.concat([src.uid]) });
    };
    const down = (src) => (e) => {
      this._root = e.currentTarget.closest('[data-root]');
      this._drag = { src: src, x: e.clientX, y: e.clientY, moved: false };
    };
    const hov = (key, side, extra) => (e) => {
      if (this._drag) return;
      this._root = e.currentTarget.closest('[data-root]');
      this.setState(Object.assign({ hover: key, hoverAt: { r: local(e.currentTarget.getBoundingClientRect()), side: side } }, extra || {}));
    };
    const pinIt = (key, side) => (e) => {
      this._root = e.currentTarget.closest('[data-root]');
      if (st.pin === key) return this.setState({ pin: null });
      this.setState({ pin: key, pinAt: { r: local(e.currentTarget.getBoundingClientRect()), side: side }, hold: null, filter: null, why: null });
    };
    const dropUnder = (e) => {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const d = el && el.closest ? el.closest('[data-drop]') : null;
      return d ? d.getAttribute('data-drop') : null;
    };

    // Slots
    const landK = st.landK || 0;
    const landIds = st.landIds || [];
    const mkSlot = (id, side) => {
      const it = getSlot(eq, ci, setIdx, id);
      const lock = it ? null : lockNote(id);
      const isHeld = hold && hold.kind === 'slot' && hold.id === id;
      const f = holdItem && !isHeld ? fit(holdItem, id) : null;
      const lit = (f && f.ok) || filter === id;
      const anim = landIds.indexOf(id) >= 0 && it ? 'land' + (landK % 2) + ' 0.32s ease-out ' + (st.landAnim ? '0.38s' : '0s') + ' both' : 'none';
      return {
        id: id,
        icon: ICON[it ? it.icon : (lock ? 'lock' : SLOT_ICON[id])],
        rim: isHeld ? T.sel : (it ? T.rim[it.r] : T.emptyRim),
        inset: isHeld ? '5px' : '3px',
        face: it ? T.face[it.r] : T.emptyFace,
        ink: it ? T.ink[it.r] : T.emptyInk,
        pips: it ? (it.r === 'L' ? [{ c: T.ink.L }, { c: T.ink.L }] : it.r === 'R' ? [{ c: T.ink.R }] : []) : [],
        glowOp: lit ? '1' : '0', glowAnim: lit ? 'glow 1.2s ease-in-out infinite' : 'none',
        cross: !!(f && !f.ok), dim: f && !f.ok ? '0.5' : '1',
        lift: isHeld ? 'translateY(-4px)' : 'none', anim: anim,
        aria: SLOT_LABEL[id] + ': ' + (it ? it.name + ', ' + RAR[it.r] : (lock ? lock : 'empty')) + (lit ? ', fits' : '') + (f && !f.ok ? ', ' + f.why : ''),
        down: down({ kind: 'slot', id: id }),
        hover: hov('slot:' + id, side)
      };
    };
    const ZIG = { shift: '23px', mt: '-9px' };
    const zig = (ids, side) => ids.map((id, i) => Object.assign(mkSlot(id, side), { ml: i % 2 ? ZIG.shift : '0px', mt: i ? ZIG.mt : '0px' }));
    const leftSlots = zig(['helmet', 'armor', 'gloves', 'leggings'], SIDE.left);
    const rightSlots = zig(['amulet', 'ring1', 'ring2', 'boots'], SIDE.right);
    const bottomSlots = ['main', 'off', 'belt0', 'belt1'].map((id) => Object.assign(mkSlot(id, SIDE.bottom), { gapBefore: id === 'belt0' }));

    // Inventory
    // Tapping an empty slot, or picking up an equipped item, shows only what could go there
    const effF = filter || (hold && hold.kind === 'slot' ? hold.id : null);
    const list = (tab === 'gear' ? inv.gear : inv.cons).filter((x) => !effF || fit(x, effF));
    const holdFromInv = hold && hold.kind === 'inv' ? hold.uid : null;
    const items = list.map((x) => {
      const f = effF ? fit(x, effF) : null;
      const on = holdFromInv === x.uid;
      return {
        uid: x.uid, icon: ICON[x.icon], rim: on ? T.sel : T.rim[x.r], inset: on ? '5px' : '3px',
        face: T.face[x.r], ink: T.ink[x.r], dim: f && !f.ok ? '0.45' : '1', lift: on ? 'translateY(-4px)' : 'none',
        pips: x.r === 'L' ? [{ c: T.ink.L }, { c: T.ink.L }] : x.r === 'R' ? [{ c: T.ink.R }] : [],
        isNew: isNew(x), hasCount: !!x.count && x.slot === 'cons', count: x.count ? String(x.count) : '',
        anim: x.moved && st.fly ? 'land' + (landK % 2) + ' 0.3s ease-out 0.4s both' : 'none',
        aria: x.name + ', ' + RAR[x.r] + (x.count ? ', ' + x.count + ' carried' : '') + (isNew(x) ? ', new' : ''),
        down: down({ kind: 'inv', uid: x.uid }),
        hover: hov('inv:' + x.uid, SIDE.inv, { seen: seen.indexOf(x.uid) < 0 ? seen.concat([x.uid]) : seen })
      };
    });
    const rows = [];
    let idx = 0, r = 0;
    while (idx < items.length) {
      const n = r % 2 ? 3 : 4;
      rows.push({ items: items.slice(idx, idx + n), indent: r % 2 ? '22px' : '0px', mt: r ? '-8px' : '0px' });
      idx += n; r += 1;
    }
        const tabs = [{ key: 'gear', label: 'Gear' }, { key: 'cons', label: 'Consumables' }].map((t) => ({
      label: t.label, on: tab === t.key ? 'true' : 'false',
      bg: tab === t.key ? '#24302C' : '#E6DCC8', ink: tab === t.key ? '#F6EEDF' : '#4A4034',
      dot: tab !== t.key && inv[t.key].some(isNew),
      pick: () => this.setState({ tab: t.key, filter: null, hover: null })
    }));

    // Details pop-up, opened beside what it describes
    const spot = (r, side) => {
      const W2 = 220, H = 190, cl = (v, a, b) => Math.max(a, Math.min(v, b));
      if (!r) return { left: 312, top: 100 };
      if (side === 'right') return { left: r.x + r.w + 8, top: cl(r.y - 16, 12, 390 - 12 - H) };
      if (side === 'left') return { left: r.x - 8 - W2, top: cl(r.y - 16, 12, 390 - 12 - H) };
      if (side === 'above') return { left: cl(r.x + r.w / 2 - W2 / 2, 12, 844 - 12 - W2), bottom: 390 - r.y + 8 };
      return { left: cl(r.x + r.w / 2 - W2 / 2, 12, 844 - 12 - W2), top: r.y + r.h + 8 };
    };
    const itemPop = (it, tag) => ({
      tag: tag + ' · ' + RAR[it.r], name: it.name + (it.count && it.slot === 'cons' ? ' ×' + it.count : ''), rim: T.rim[it.r], tagInk: T.tagInk[it.r],
      desc: DESC[it.name] || (it.acat && it.acat !== 'shield' ? titleCase(it.acat) + ' armor' + (it.slot === 'armor' ? '.' : ' piece.') : (it.slot === 'ring' || it.slot === 'amulet' ? 'Trinket.' : (it.slot !== 'weapon' ? 'No armor category.' : ''))),
      cards: (CARDS[it.name] || []).map((n) => ({ n: n, bg: '#24302C' })), stats: true
    });
    const hv = st.hover || st.pin || null;
    const at = st.hover ? st.hoverAt : st.pinAt;
    let pop = null;
    if (st.why) {
      const w = st.why;
      pop = Object.assign({ tag: 'Can\'t equip', name: w.name, rim: '#8E3B2E', tagInk: '#8E3B2E', desc: w.text, cards: [], stats: false }, spot(w.r, w.r && w.r.x > 420 ? 'left' : 'right'));
    } else if (hv && at && !st.drag && !(hold && ((hold.kind === 'slot' && hv === 'slot:' + hold.id) || (hold.kind === 'inv' && hv === 'inv:' + hold.uid)))) {
      const kind = hv.slice(0, hv.indexOf(':')), key = hv.slice(hv.indexOf(':') + 1);
      if (kind === 'slot') {
        const it = getSlot(eq, ci, setIdx, key);
        const lock = it ? null : lockNote(key);
        if (it || lock) pop = it ? itemPop(it, SLOT_LABEL[key]) : { tag: SLOT_LABEL[key], name: 'Empty', rim: T.emptyRim, tagInk: '#5A5040', desc: lock, cards: [], stats: false };
      } else if (kind === 'inv') {
        const f = findInv(inv, key);
        if (f) pop = itemPop(f.it, f.t === 'gear' ? 'Inventory' : 'Consumable');
      } else if (kind === 'ab') {
        const profs = ch.prof.filter((p) => PROF_BASE[p] === key);
        pop = { tag: 'Ability', name: ABN[key], rim: '#BFAE8E', tagInk: '#5A5040', desc: profs.length ? 'Proficient in:' : 'No proficiencies.', cards: profs.map((p) => ({ n: p + ' +1', bg: '#2E6B3A' })), stats: false };
      } else if (kind === 'pas') {
        const ps = PASSIVES[Number(key)];
        pop = { tag: ps.type, name: ps.name, rim: ps.color, tagInk: ps.color, desc: ps.desc, cards: [], stats: false };
      }
      if (pop) Object.assign(pop, spot(at.r, at.side));
    }
    const popOut = pop ? {
      show: true, tag: pop.tag, name: pop.name, rim: pop.rim, tagInk: pop.tagInk, desc: pop.desc || '', hasDesc: !!pop.desc,
      cards: pop.cards, hasCards: pop.cards.length > 0, hasStats: !!pop.stats,
      left: pop.left.toFixed(0) + 'px', top: pop.top != null ? pop.top.toFixed(0) + 'px' : 'auto', bottom: pop.bottom != null ? pop.bottom.toFixed(0) + 'px' : 'auto'
    } : { show: false, tag: '', name: '', rim: '#BFAE8E', tagInk: '#5A5040', desc: '', hasDesc: false, cards: [], hasCards: false, hasStats: false, left: '0px', top: '0px', bottom: 'auto' };

    // The stand-in mini wears what's equipped (all but rings and the amulet)
    const g = me.gear;
    const ARMC = { light: '#B08A62', medium: '#8E9AA0', heavy: '#66737D' };
    const mini = {
      skin: ch.color, body: g.armor ? ARMC[g.armor.acat] : '#D9CBB2', legs: g.leggings ? '#7B6A55' : '#C7B79C',
      helm: g.helmet ? (ARMC[g.helmet.acat] || '#8E9AA0') : '#8E9AA0', helmOp: g.helmet ? '1' : '0',
      bootsOp: g.boots ? '1' : '0', glovesOp: g.gloves ? '1' : '0',
      mainIcon: set.main ? ICON[set.main.icon] : '', mainOp: set.main ? '1' : '0',
      offIcon: set.off ? ICON[set.off.icon] : '', offOp: set.off ? '1' : '0',
      aria: ch.name + ' mini wearing ' + ['helmet', 'armor', 'gloves', 'leggings', 'boots'].filter((k) => g[k]).map((k) => g[k].name).concat([set.main, set.off].filter(Boolean).map((x) => x.name)).join(', ')
    };

    const abilities = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'].map((k, n) => {
      const v = ch.ab[k];
      const ml = v * 13 + (v - 1) * 3 <= 52 ? '3px' : ((52 - v * 13) / (v - 1)).toFixed(2) + 'px';
      const open = st.pin === 'ab:' + k;
      return {
        k: k, v: v, divider: n > 0, open: open ? 'true' : 'false', bg: open ? '#E6DCC8' : 'transparent',
        coins: Array.from({ length: v }, (_, i) => ({ ml: i ? ml : '0px' })),
        aria: ABN[k] + ' ' + v,
        pin: pinIt('ab:' + k, SIDE.ab),
        hover: hov('ab:' + k, SIDE.ab)
      };
    });

    const party = CH.map((p, i) => ({
      initial: p.initial, face: p.color, on: i === ci ? 'true' : 'false', injured: !!p.injured,
      rim: i === ci ? T.sel : '#BFAE8E', inset: i === ci ? '4px' : '3px',
      hpW: Math.round(p.hp * 100) + '%',
      aria: p.name + ': ' + Math.round(p.hp * 100) + '% HP' + (p.injured ? ', injured' : ''),
      pick: () => this.setState({ ci: i, set: 0, hold: null, filter: null, hover: null, pin: null, why: null })
    }));

    const flies = (st.fly || []).map((f) => ({
      rim: f.rim, face: f.face, ink: f.ink, icon: f.icon,
      left: (st.flyGo ? f.tx : f.fx).toFixed(0) + 'px', top: (st.flyGo ? f.ty : f.fy).toFixed(0) + 'px',
      tr: st.flyGo ? 'left 0.42s cubic-bezier(.5,0,.3,1), top 0.42s cubic-bezier(.5,.4,.3,1)' : 'none'
    }));
    const drag = st.drag || null;
    const gItem = drag ? holdItem : null;

    return {
      c: { name: ch.name, sub: ch.sub, abilities: abilities },
      party: party, leftSlots: leftSlots, rightSlots: rightSlots, bottomSlots: bottomSlots, mini: mini,
      setLabel: 'set ' + (setIdx + 1), setShort: 'Set ' + (setIdx + 1),
      swapSet: () => this.setState({ set: setIdx === 0 ? 1 : 0, hold: null, filter: null, hover: null }),
      inv: {
        rows: rows, tabs: tabs, empty: items.length === 0,
        hasFilter: !!effF, filterLabel: effF ? 'Fits ' + SLOT_LABEL[effF].toLowerCase() : '',
        clearFilter: () => this.setState({ filter: null, hold: null }),
        outline: hold && hold.kind === 'slot' ? '3px dashed #B5532F' : 'none'
      },
      pop: popOut, flies: flies,
      passives: PASSIVES.map((ps, i) => ({ color: ps.color, icon: ps.icon, aria: ps.type + ': ' + ps.name, pin: pinIt('pas:' + i, SIDE.pas), hover: hov('pas:' + i, SIDE.pas) })),
      ghost: drag && gItem ? { show: true, left: (drag.x - 23).toFixed(0) + 'px', top: (drag.y - 30).toFixed(0) + 'px', face: T.face[gItem.r], ink: T.ink[gItem.r], icon: ICON[gItem.icon] } : { show: false, left: '0px', top: '0px', face: '#FCF7EE', ink: '#33403B', icon: '' },
      unhover: () => { if (st.hover) this.setState({ hover: null, hoverAt: null }); },
      dragMove: (e) => {
        const d = this._drag; if (!d) return;
        if (!d.moved && Math.abs(e.clientX - d.x) + Math.abs(e.clientY - d.y) > 6) {
          const has = d.src.kind === 'inv' || getSlot(eq, ci, setIdx, d.src.id);
          if (!has) return;
          d.moved = true;
        }
        if (!d.moved) return;
        const R = e.currentTarget.getBoundingClientRect(); const sc = R.width / 844 || 1;
        this.setState({ drag: { x: (e.clientX - R.left) / sc, y: (e.clientY - R.top) / sc }, hold: d.src, hover: null, filter: d.src.kind === 'slot' ? null : filter });
      },
      dragEnd: (e) => {
        const d = this._drag; this._drag = null;
        if (!d) {
          if (e.target.closest && e.target.closest('button')) return;
          this._root = e.currentTarget;
          if (hold && hold.kind === 'slot' && e.target.closest && e.target.closest('[data-drop="inv"]')) return unequip(hold.id, true);
          if (hold || st.pin || st.why) this.setState({ hold: null, pin: null, why: null });
          return;
        }
        if (!d.moved) return tap(d.src);
        const to = dropUnder(e);
        this.setState({ drag: null });
        if (to === 'inv') { if (d.src.kind === 'slot') return unequip(d.src.id, false); return this.setState({ hold: null }); }
        if (to && !(d.src.kind === 'slot' && d.src.id === to)) {
          const f = fit(holdItem, to);
          if (f && f.ok) return place(d.src, to, false);
          if (f && !f.ok) { this.setState({ hold: null }); return sayWhy(f.why, '[data-drop="' + to + '"]', holdItem.name); }
        }
        this.setState({ hold: null });
      },
      dragCancel: () => { if (this._drag) { this._drag = null; this.setState({ drag: null, hold: null }); } }
    };
  }
}
</script>
</body>
</html>
