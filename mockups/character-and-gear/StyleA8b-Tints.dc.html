          { main: it('Greatsword', 'R', 'sword'), off: null, offNote: 'Two-handed weapon equipped', offIcon: 'lock' }
        ],
        slots: { helmet: it('Heavy helm', 'R', 'helmet', 'Heavy armor piece'), armor: it('Heavy armor', 'L', 'armor', 'Heavy armor'), gloves: it('Gloves', 'R', 'gloves', 'No armor category'), leggings: it('Leggings', 'R', 'leggings', 'No armor category'), amulet: it('Amulet', 'L', 'amulet', 'Trinket'), ring1: it('Ring', 'R', 'ring', 'Trinket'), ring2: it('Ring', 'R', 'ring', 'Trinket'), boots: it('Boots', 'C', 'boots', 'No armor category') },
        cons: [it('Potion', 'R', 'potion', 'Consumable'), it('Throwable', 'C', 'bomb', 'Consumable')]
      },
      {
        name: 'Fluffy', sub: 'Cat Wizard · Companion · Lv [late]', initial: 'F', color: '#C9B3E6',
        ab: { STR: 1, DEX: 3, CON: 2, INT: 5, WIS: 3, CHA: 1 },
        sets: [
          { main: it('Staff', 'C', 'staff'), off: null, offNote: 'Two-handed weapon equipped', offIcon: 'lock' },
          { main: it('Wand', 'R', 'wand'), off: null, offNote: null, offIcon: 'empty' }
        ],
        slots: { helmet: null, armor: null, armorNote: 'Wizards wear no armor', armorIcon: 'lock', gloves: null, leggings: null, amulet: it('Amulet', 'R', 'amulet', 'Trinket'), ring1: it('Ring', 'C', 'ring', 'Trinket'), ring2: null, boots: null },
        cons: [it('Potion', 'C', 'potion', 'Consumable'), null]
      },
      {
        name: 'Chelmsford', sub: 'Dragonborn Cleric · Companion · Lv [late]', initial: 'C', color: '#8EC3F2',
        ab: { STR: 3, DEX: 1, CON: 4, INT: 2, WIS: 5, CHA: 3 },
        sets: [
          { main: it('Mace', 'C', 'mace'), off: it('Shield', 'C', 'shield') },
          { main: it('Warhammer', 'C', 'hammer'), off: null, offNote: 'Two-handed weapon equipped', offIcon: 'lock' }
        ],
        slots: { helmet: it('Medium helm', 'C', 'helmet', 'Medium armor piece'), armor: it('Medium armor', 'C', 'armor', 'Medium armor'), gloves: null, leggings: it('Leggings', 'C', 'leggings', 'No armor category'), amulet: it('Amulet', 'C', 'amulet', 'Trinket'), ring1: null, ring2: null, boots: it('Boots', 'C', 'boots', 'No armor category') },
        cons: [it('Potion', 'C', 'potion', 'Consumable'), it('Potion', 'C', 'potion', 'Consumable')]
      }
    ];
    const c = chars[ci];
    const details = {};

    const mk = (id, label, item, note, emptyIcon, slotIcon) => {
      const on = active === id;
      if (item) {
        details[id] = {
          tag: label + ' · ' + RAR[item.r], name: item.name, rim: T.rim[item.r], tagInk: T.tagInk[item.r],
          desc: DESC[item.name] || item.kind || '', cards: (CARDS[item.name] || []).map((n) => ({ n: n })),
          action: 'Unequip'
        };
      } else {
        details[id] = {
          tag: label, name: 'Empty', rim: T.emptyRim, tagInk: '#5A5040',
          desc: note || 'Tap to pick something from the party inventory.', cards: [], action: 'Choose item'
        };
      }
      return {
        icon: ICON[item ? item.icon : (emptyIcon || slotIcon)],
        rim: on ? T.sel : (item ? T.rim[item.r] : T.emptyRim),
        inset: on ? '5px' : '3px',
        face: item ? T.face[item.r] : T.emptyFace,
        ink: item ? T.ink[item.r] : T.emptyInk,
        aria: label + ': ' + (item ? item.name + ', ' + RAR[item.r] : 'empty'),
        pin: () => this.setState({ pinned: pinned === id ? null : id }),
        hover: () => this.setState({ hover: id })
      };
    };

    const s = c.slots;
    const zig = (arr) => arr.map((x, i) => Object.assign(x, { shift: i % 2 ? '28px' : '0px', mt: i ? '-11px' : '0px' }));
    const leftSlots = zig([
      mk('l:helmet', 'Helmet', s.helmet, null, null, 'helmet'),
      mk('l:armor', 'Armor', s.armor, s.armorNote, s.armorIcon, 'armor'),
      mk('l:gloves', 'Gloves', s.gloves, null, null, 'gloves'),
      mk('l:leggings', 'Leggings', s.leggings, null, null, 'leggings')
    ]);
    const rightSlots = zig([
      mk('r:amulet', 'Amulet', s.amulet, null, null, 'amulet'),
      mk('r:ring1', 'Ring', s.ring1, null, null, 'ring'),
      mk('r:ring2', 'Ring', s.ring2, null, null, 'ring'),
      mk('r:boots', 'Boots', s.boots, null, null, 'boots')
    ]);
    const ws = c.sets[setIdx];
    const weaponSlots = [
      mk('w:main', 'Main hand', ws.main, null, null, 'sword'),
      mk('w:off', 'Off hand', ws.off, ws.offNote, ws.offIcon, 'shield')
    ];
    const cons = c.cons.map((x, i) => mk('b:' + i, 'Belt', x, null, null, 'potion'));
    // Group tints: each section's hex faces share one colour (rarity stays on the rim).
    const G = { armor: '#CFDDC6', trinket: '#E2CFE6', hands: '#EDCFC4' };
    leftSlots.forEach((x) => { x.face = G.armor; });
    rightSlots.forEach((x) => { x.face = G.trinket; });
    weaponSlots.forEach((x) => { x.face = G.hands; });
    cons.forEach((x) => { x.face = G.hands; });

    const gearInv = [
      { name: 'Shortbow', r: 'C', icon: 'bow' },
      { name: 'Dagger', r: 'R', icon: 'sword' },
      { name: 'Battleaxe', r: 'C', icon: 'axe' },
      { name: 'Light armor', r: 'C', icon: 'armor', kind: 'Light armor' },
      { name: 'Ring', r: 'R', icon: 'ring', kind: 'Trinket' },
      { name: 'Spear', r: 'L', icon: 'spear' }
    ];
    const consInv = [
      { name: 'Potion', r: 'C', icon: 'potion', kind: 'Consumable', count: 4 },
      { name: 'Throwable', r: 'C', icon: 'bomb', kind: 'Consumable', count: 2 },
      { name: 'Camp kit', r: 'C', icon: 'tent', kind: 'Pitch a camp. One kit covers the whole party.', count: 1 }
    ];
    const list = tab === 'gear' ? gearInv : consInv;
    const items = list.map((x, i) => {
      const id = 'i:' + tab + i;
      const on = active === id;
      details[id] = {
        tag: (tab === 'gear' ? 'Inventory' : 'Consumable') + ' · ' + RAR[x.r], name: x.name + (x.count ? ' ×' + x.count : ''),
        rim: T.rim[x.r], tagInk: T.tagInk[x.r], desc: DESC[x.name] || x.kind || '',
        cards: (CARDS[x.name] || []).map((n) => ({ n: n })), action: 'Equip'
      };
      return {
        icon: ICON[x.icon], rim: on ? T.sel : T.rim[x.r], inset: on ? '5px' : '3px',
        face: T.face[x.r], ink: T.ink[x.r],
        hasCount: !!x.count, count: x.count ? String(x.count) : '',
        aria: x.name + ', ' + RAR[x.r] + (x.count ? ', ' + x.count + ' carried' : ''),
        pin: () => this.setState({ pinned: pinned === id ? null : id }),
        hover: () => this.setState({ hover: id })
      };
    });
    const invRows = [];
    let idx = 0, r = 0;
    while (idx < items.length) {
      const n = r % 2 ? 3 : 4;
      invRows.push({ items: items.slice(idx, idx + n), indent: r % 2 ? '24px' : '0px', mt: r ? '-9px' : '0px' });
      idx += n; r += 1;
    }

    const abilities = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'].map((k, n) => ({
      k: k, v: c.ab[k], divider: n > 0, coins: Array.from({ length: c.ab[k] }, (_, i) => ({ ml: i ? '-7px' : '0px' }))
    }));
    const party = chars.map((p, i) => ({
      initial: p.initial, face: p.color, ink: '#22262E',
      rim: i === ci ? T.sel : '#BFAE8E', inset: i === ci ? '4px' : '3px',
      aria: p.name + (i === ci ? ', selected' : ''),
      pick: () => this.setState({ ci: i, set: 0, pinned: null, hover: null })
    })).concat([{
      initial: '+', face: T.emptyFace, ink: T.emptyInk, rim: T.emptyRim, inset: '3px',
      aria: 'Empty companion slot', pick: () => {}
    }]);

    const popRaw = active ? details[active] : null;
    const pop = popRaw ? Object.assign({}, popRaw, { hasCards: popRaw.cards.length > 0 }) : { tag: '', name: '', rim: '#BFAE8E', tagInk: '#5A5040', desc: '', cards: [], hasCards: false, action: '' };

    return {
      c: { name: c.name, sub: c.sub, abilities: abilities },
      party: party, leftSlots: leftSlots, rightSlots: rightSlots, weaponSlots: weaponSlots, cons: cons,
      setLabel: 'set ' + (setIdx + 1), setShort: 'Set ' + (setIdx + 1),
      swapSet: () => this.setState({ set: setIdx === 0 ? 1 : 0, pinned: null, hover: null }),
      invRows: invRows,
      hasPop: !!popRaw, pop: pop,
      closePop: () => this.setState({ pinned: null, hover: null }),
      unhover: () => this.setState({ hover: null }),
      tabGearBg: tab === 'gear' ? '#24302C' : '#E6DCC8', tabGearInk: tab === 'gear' ? '#F6EEDF' : '#4A4034',
      tabConsBg: tab === 'cons' ? '#24302C' : '#E6DCC8', tabConsInk: tab === 'cons' ? '#F6EEDF' : '#4A4034',
      pickGear: () => this.setState({ tab: 'gear', pinned: null, hover: null }),
      pickCons: () => this.setState({ tab: 'cons', pinned: null, hover: null })
    };
  }
}
</script>
