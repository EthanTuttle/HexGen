<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const CFG = {"prop": "heroic", "pose": "cast", "paint": "clean", "label": "Pose: casting"};
    const PROP = {
      heroic: { hs: 1.15, sx: 1, sy: 1, ws: 1.2 },
      chunky: { hs: 1.55, sx: 1.08, sy: 0.78, ws: 1.1 },
      realistic: { hs: 0.88, sx: 0.96, sy: 1.06, ws: 1 }
    }[CFG.prop];
    const PAINT = {
      clean: { line: 'none', lw: '0', shade: '0', hi: '0.35', trim: '1' },
      tabletop: { line: '#2A2F3A', lw: '1.3', shade: '0.22', hi: '0.6', trim: '1' },
      toy: { line: 'none', lw: '0', shade: '0', hi: '0', trim: '0' }
    }[CFG.paint];
    const full = { skin: '#4F86C6', skinLight: '#9CC4EA', skinDark: '#3E6FA8', steel: '#8C99A8', steelLight: '#9AA6B2', steelDark: '#7A8796', steelLine: '#5E6875',
      boot: '#4A4E58', cloth: '#EFE3C8', gold: '#E4B54C', leather: '#6B4C35', shield: '#3E5A70', horn: '#E8DCC0', hornLine: '#B9AC90' };
    const toy = { skin: '#4F86C6', skinLight: '#4F86C6', skinDark: '#4F86C6', steel: '#8E9BAA', steelLight: '#8E9BAA', steelDark: '#8E9BAA', steelLine: '#8E9BAA',
      boot: '#8E9BAA', cloth: '#F1E7D0', gold: '#E0A93B', leather: '#6B4C35', shield: '#3E5A70', horn: '#E8DCC0', hornLine: '#E8DCC0' };
    const c = CFG.paint === 'toy' ? toy : full;
    const around = (x, y, s) => 'translate(' + x + ' ' + y + ') scale(' + s + ') translate(' + (-x) + ' ' + (-y) + ')';
    const neckY = 236 - (236 - 100) * PROP.sy;
    const shieldPose = { raised: 'translate(0 0)', guard: 'translate(-12 -14)', cast: 'translate(2 10)' }[CFG.pose];
    const t = {
      body: 'translate(100 236) scale(' + PROP.sx + ' ' + PROP.sy + ') translate(-100 -236)',
      head: 'translate(100 ' + neckY.toFixed(1) + ') scale(' + PROP.hs + ') translate(-100 -100)',
      maceRaised: around(66, 107, PROP.ws), maceGuard: around(68, 172, PROP.ws), sun: around(61, 102, PROP.ws),
      shield: shieldPose + ' ' + around(134, 150, CFG.pose === 'guard' ? PROP.ws * 1.08 : PROP.ws),
      raised: CFG.pose === 'raised' ? '1' : '0', guard: CFG.pose === 'guard' ? '1' : '0', cast: CFG.pose === 'cast' ? '1' : '0'
    };
    return {
      c: c, p: PAINT, t: t, label: CFG.label,
      shadowRx: String(Math.round(38 * PROP.sx)),
      eyeRx: CFG.prop === 'chunky' ? '4.4' : '3.6', eyeRy: CFG.prop === 'chunky' ? '3.4' : '2.6',
      aria: 'Painted miniature of Chelmsford, a blue dragonborn cleric, on a hex base. ' + CFG.label
    };
  }
}
</script>
