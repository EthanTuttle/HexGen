<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":540}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const step = st.step ?? 0;
    const k = ((step % 6) + 6) % 6;
    const VIEWS = [
      { v: 'a', flip: false, name: 'Front three-quarter', drawn: true },
      { v: 'p', flip: false, name: 'Right side', drawn: true },
      { v: 'b', flip: false, name: 'Back three-quarter', drawn: true },
      { v: 'b', flip: true, name: 'Back three-quarter, other side', drawn: false },
      { v: 'p', flip: true, name: 'Left side', drawn: false },
      { v: 'a', flip: true, name: 'Front three-quarter, other side', drawn: false }
    ];
    const cur = VIEWS[k];
    return {
      deg: String(step * 60),
      v: { a: cur.v === 'a' ? '1' : '0', p: cur.v === 'p' ? '1' : '0', b: cur.v === 'b' ? '1' : '0', flip: cur.flip ? 'scale(-1, 1)' : 'none' },
      angle: (k * 60) + '° · ' + cur.name,
      note: cur.drawn ? 'Drawn view' : 'Mirrored view: mace and shield swap hands',
      noteColor: cur.drawn ? '#43524D' : '#9A4A12',
      aria: 'Chelmsford mini, ' + cur.name + (cur.drawn ? '' : ' (mirrored)'),
      left: () => this.setState({ step: step - 1 }),
      right: () => this.setState({ step: step + 1 })
    };
  }
}
</script>
