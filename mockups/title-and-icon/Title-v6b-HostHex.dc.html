<script type="text/x-dc" data-dc-script data-props='{"firstLaunch":{"editor":"boolean","default":false},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { pop: null, toast: false, hero: 0, host: false, editing: false, code: 'KDRWQX' }; }
  renderVals() {
    const first = this.props.firstLaunch ?? false;
    const p = this.state.pop;
    const T = { load: 'Load', join: 'Join a game', set: 'Settings', host: 'Multiplayer', mp: 'Multiplayer' };
    const H = [
      { n: '[Hero name 1]', sub: '[Race] [Class] · Lv [N]', c: '#3E6F8C', i: '1', day: '[Saved time]' },
      { n: '[Hero name 2]', sub: '[Race] [Class] · Lv [N]', c: '#B5532F', i: '2', day: '[Saved time]' },
      { n: '[Hero name 3]', sub: '[Race] [Class] · Lv [N]', c: '#5E8F5A', i: '3', day: '[Saved time]' }
    ];
    const autos = [];
    for (let i = 0; i < 10; i++) autos.push({ a: '[Region]', b: '[Saved time]' });
    const say = (t) => { this.setState({ toast: t }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: false }), 1400); };
    const on = this.state.host;
    return {
      hasSave: !first,
      newCls: first ? 'p' : '',
      pop: { any: !!p, load: p === 'load', join: p === 'join', set: p === 'set', host: p === 'host', mp: p === 'mp', title: p ? T[p] : '', w: p === 'load' ? '640px' : (p === 'mp' ? '600px' : '470px') },
      heroes: H.map((h, i) => ({ ...h, on: i === this.state.hero ? 'true' : 'false', bg: i === this.state.hero ? '#FFE9A8' : '#F6EEDF', ring: i === this.state.hero ? 'inset 0 0 0 2px #B5532F' : 'none', pick: () => this.setState({ hero: i }) })),
      autos,
      slots: [
        { a: 'Slot 1', b: '[Region] · [Saved time]', op: 1 },
        { a: 'Slot 2', b: '[Region] · [Saved time]', op: 1 },
        { a: 'Slot 3', b: 'Empty', op: 0.6 }
      ],
      host: { on: on ? 'true' : 'false', isOn: on, track: on ? '#5E8F5A' : '#BFAE8E', side: on ? 'flex-end' : 'flex-start', lab: on ? 'On' : 'Off', editing: this.state.editing, notEditing: !this.state.editing, letters: this.state.code.split(''), code: this.state.code, dot: on ? '#5E8F5A' : '#BFAE8E', ring: on ? '0 0 0 3px #7FB36A' : 'none', glow: on ? 'drop-shadow(0 0 8px #9CD07F)' : 'drop-shadow(0 3px 0 #A48A62)', mpLab: on ? 'On' : '', rowText: on ? 'Hosting: On · ' + this.state.code : 'Hosting: Off' },
      toggleHost: () => this.setState({ host: !this.state.host }),
      editCode: () => this.setState({ editing: true }),
      saveCode: () => { const el = document.getElementById('hc'); const v = el && el.value ? el.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 6) : ''; this.setState({ editing: false, code: v.length === 6 ? v : this.state.code }); },
      toast: this.state.toast,
      cont: () => say('Continue'),
      newGame: () => say('New campaign'),
      openLoad: () => this.setState({ pop: 'load', hero: 0 }),
      openJoin: () => this.setState({ pop: 'join' }),
      openSet: () => this.setState({ pop: 'set' }),
      openHost: () => this.setState({ pop: 'host', editing: false }),
      openMp: () => this.setState({ pop: 'mp', editing: false }),
      close: () => this.setState({ pop: null, editing: false })
    };
  }
  componentWillUnmount(){ clearTimeout(this._t); }
}
</script>
