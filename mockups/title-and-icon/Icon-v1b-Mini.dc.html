body{margin:0}
a{color:#B5532F}a:hover{color:#7E3519}
.w{display:block;filter:drop-shadow(0 3px 0 #A48A62)}

.b{border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:38px;padding:0 20px;box-sizing:border-box;clip-path:polygon(13px 0,calc(100% - 13px) 0,100% 50%,calc(100% - 13px) 100%,13px 100%,0 50%);font-family:'Lilita One',sans-serif;font-size:16px;background:#FCF7EE;color:#33403B}

@keyframes pop{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}
@keyframes rise{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
