<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">Heads or Hexes · Story Editor</div>
  <div class="mode-tabs" id="mode-tabs">
    <button data-mode="scenes" class="active">Scenes</button>
    <button data-mode="characters">Characters</button>
  </div>
  <div id="scene-title" class="scene-title"></div>
  <div class="spacer"></div>
  <span class="scene-only">
    <button id="btn-undo" title="Undo (⌘Z)">Undo</button>
    <button id="btn-redo" title="Redo (⇧⌘Z)">Redo</button>
    <button id="btn-fit" title="Fit the scene in view (F)">Fit</button>
  </span>
  <button id="btn-lists" title="Edit the name lists used in dropdowns">Lists</button>
  <span id="save-status" class="status">…</span>
</header>

<main id="layout">
  <aside id="char-sidebar" class="hidden">
    <div class="side-head">
      <input id="char-search" type="search" placeholder="Search characters…">
      <button id="btn-new-char" class="primary">+ Character</button>
    </div>
    <div id="char-list"></div>
  </aside>

  <aside id="sidebar">
    <div class="side-head">
      <input id="search" type="search" placeholder="Search scenes, lines…">
      <button id="btn-new" class="primary">+ Scene</button>
    </div>
    <div class="tabs" id="group-tabs">
      <button data-group="all" class="active">All</button>
      <button data-group="place">Places</button>
      <button data-group="person">People</button>
      <button data-group="other">Other</button>
    </div>
    <div id="scene-list"></div>
  </aside>

  <section id="canvas">
    <div id="world">
      <svg id="edges"></svg>
      <div id="nodes"></div>
    </div>
    <div id="empty-hint" class="empty-hint">Pick a scene on the left, or make a new one.</div>
    <div id="palette" class="palette">
      <span>Add:</span>
      <button data-add="line">NPC line</button>
      <button data-add="narration">Narration</button>
      <button data-add="choice">Hero choice</button>
      <button data-add="branch">Condition</button>
      <button data-add="setflag">Set flag</button>
      <button data-add="end">End</button>
    </div>
    <div id="drop-menu" class="drop-menu hidden"></div>
  </section>

  <section id="char-page" class="hidden"></section>

  <aside id="char-used" class="hidden"></aside>

  <aside id="inspector">
    <div class="tabs" id="insp-tabs">
      <button data-tab="edit" class="active">Edit</button>
      <button data-tab="problems">Problems <span id="problem-count" class="count"></span></button>
    </div>
    <div id="insp-edit" class="insp-body"></div>
    <div id="insp-problems" class="insp-body hidden"></div>
  </aside>
</main>

<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>

<script src="app.js"></script>
<script src="characters.js"></script>
</body>
</html>
